<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk YouTube Transcript Extractor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { margin-bottom: 5px; }
    p { color: #94a3b8; margin-top: 0; }
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .status {
      margin-bottom: 15px;
      font-size: 14px;
      color: #38bdf8;
    }
    .result-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .result-title { font-weight: bold; color: #e2e8f0; }
    .transcript-text {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      color: #cbd5e1;
      max-height: 300px;
      overflow-y: auto;
    }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <h1>YouTube Transcript Extractor</h1>
  <p>Paste one YouTube URL or a list of URLs (one per line) to extract word-for-word transcripts.</p>

  <textarea id="urlInput" rows="5">https://youtube.com</textarea>

  <div class="controls">
    <button id="extractBtn" onclick="processVideos()">Extract Transcripts</button>
    <button class="secondary" onclick="copyAll()">Copy All Text</button>
    <button class="secondary" onclick="downloadTxt()">Download .TXT</button>
    <button class="secondary" onclick="clearAll()">Clear</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results"></div>

  <script>
    const PROXY = "https://cors.dev";
    let extractedData = [];

    function getVideoId(url) {
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=|shorts\/)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.trim().match(regex);
      return match ? match[1] : null;
    }

    function decodeHtml(html) {
      const txt = document.createElement("textarea");
      txt.innerHTML = html;
      return txt.value;
    }

    async function fetchTranscript(videoId) {
      const videoUrl = `https://youtube.com{videoId}`;
      const response = await fetch(PROXY + videoUrl);
      if (!response.ok) throw new Error("Failed to reach YouTube via proxy.");
      
      const html = await response.text();
      
      const titleMatch = html.match(/<title>(.*?)<\/title>/);
      const title = titleMatch ? decodeHtml(titleMatch[1].replace(" - YouTube", "")) : videoId;

      const captionMatch = html.match(/"captionTracks":(\[.*?\])/);
      if (!captionMatch) {
        throw new Error("No captions/transcript available for this video.");
      }

      const captionTracks = JSON.parse(captionMatch[1]);
      const track = captionTracks.find(t => t.languageCode === 'en') || captionTracks[0];
      
      const transcriptRes = await fetch(PROXY + track.baseUrl);
      if (!transcriptRes.ok) throw new Error("Failed to fetch transcript XML.");
      const xmlText = await transcriptRes.text();

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const textNodes = xmlDoc.getElementsByTagName("text");
      
      let lines = [];
      for (let i = 0; i < textNodes.length; i++) {
        const cleanLine = decodeHtml(textNodes[i].textContent)
          .replace(/\n/g, " ")
          .trim();
        if (cleanLine) lines.push(cleanLine);
      }

      if (lines.length === 0) {
        throw new Error("Transcript track was empty.");
      }

      return {
        id: videoId,
        title: title,
        text: lines.join(" ")
      };
    }

    async function processVideos() {
      const rawInput = document.getElementById("urlInput").value;
      const lines = rawInput.split("\n").map(l => l.trim()).filter(Boolean);
      const resultsDiv = document.getElementById("results");
      const statusDiv = document.getElementById("status");
      const btn = document.getElementById("extractBtn");

      if (lines.length === 0) {
        statusDiv.textContent = "Please enter at least one YouTube URL.";
        return;
      }

      btn.disabled = true;
      resultsDiv.innerHTML = "";
      extractedData = [];

      for (let i = 0; i < lines.length; i++) {
        const videoId = getVideoId(lines[i]);
        statusDiv.textContent = `Processing ${i + 1} of ${lines.length}...`;

        if (!videoId) {
          appendError(lines[i], "Invalid YouTube URL.");
          continue;
        }

        try {
          const data = await fetchTranscript(videoId);
          extractedData.push(data);
          appendResult(data);
        } catch (err) {
          appendError(lines[i], err.message);
        }
      }

      statusDiv.textContent = `Done! Extracted ${extractedData.length} of ${lines.length} transcripts.`;
      btn.disabled = false;
    }

    function appendResult(data) {
      const resultsDiv = document.getElementById("results");
      const box = document.createElement("div");
      box.className = "result-box";
      box.innerHTML = `
        <div class="result-header">
          <span class="result-title">${data.title}</span>
          <button class="secondary" onclick="copySingle('${data.id}')">Copy</button>
        </div>
        <div class="transcript-text" id="text-${data.id}">${data.text}</div>
      `;
      resultsDiv.appendChild(box);
    }

    function appendError(url, message) {
      const resultsDiv = document.getElementById("results");
      const box = document.createElement("div");
      box.className = "result-box";
      box.innerHTML = `<div class="error"><strong>Failed:</strong> ${url} — ${message}</div>`;
      resultsDiv.appendChild(box);
    }

    function copySingle(id) {
      const text = document.getElementById(`text-${id}`).innerText;
      navigator.clipboard.writeText(text);
    }

    function copyAll() {
      if (extractedData.length === 0) return;
      const combined = extractedData.map(d => `=== ${d.title} ===\n\n${d.text}`).join("\n\n\n");
      navigator.clipboard.writeText(combined);
      document.getElementById("status").textContent = "All transcripts copied to clipboard!";
    }

    function downloadTxt() {
      if (extractedData.length === 0) return;
      const combined = extractedData.map(d => `=== ${d.title} ===\n\n${d.text}`).join("\n\n\n");
      const blob = new Blob([combined], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "youtube-transcripts.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAll() {
      document.getElementById("urlInput").value = "";
      document.getElementById("results").innerHTML = "";
      document.getElementById("status").textContent = "";
      extractedData = [];
    }
  </script>
</body>
</html>
