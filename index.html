
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SearchMiner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0d12;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 38px;
    margin-bottom: 8px;
    color: white;
}

header h1 span {
    color: #3b82f6;
}

header p {
    color: #8994a7;
}

.panel {
    background: #151a24;
    border: 1px solid #293244;
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
}

label.title {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 12px;
}

.services {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
}

.service {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: #202838;
    border: 1px solid #354158;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
}

.service:hover {
    border-color: #3b82f6;
}

.service input {
    accent-color: #3b82f6;
}

#keyword {
    width: 100%;
    padding: 15px;
    border-radius: 7px;
    border: 1px solid #354158;
    background: #0c111b;
    color: white;
    font-size: 16px;
    outline: none;
}

#keyword:focus {
    border-color: #3b82f6;
}

.options {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.options label {
    font-size: 13px;
    color: #b9c3d3;
    display: flex;
    align-items: center;
    gap: 7px;
}

.options input {
    accent-color: #3b82f6;
}

button {
    border: none;
    border-radius: 7px;
    padding: 13px 20px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.search-btn {
    background: #2563eb;
    color: white;
}

.clear-btn {
    background: #303b4e;
    color: white;
}

.copy-btn {
    background: #1d3557;
    color: #93c5fd;
}

#status {
    color: #60a5fa;
    font-size: 13px;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

.results-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.results-top h2 {
    font-size: 19px;
    margin: 0;
}

#counter {
    color: #60a5fa;
    font-size: 13px;
}

#results {
    width: 100%;
    min-height: 250px;
    height: 450px;
    resize: vertical;
    background: #0b1019;
    color: #dbeafe;
    border: 1px solid #303b4e;
    border-radius: 7px;
    padding: 15px;
    font-size: 13px;
    line-height: 1.8;
    outline: none;
}

@media(max-width:600px) {
    .container {
        padding: 12px;
        margin: 15px auto;
    }

    header h1 {
        font-size: 30px;
    }

    .panel {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Search<span>Miner</span></h1>
    <p>Discover search suggestions from multiple search engines.</p>
 <p>Created By: Anthony Webb © 2026</p>
</header>

<div class="panel">

    <label class="title">Select Search Services</label>

    <div class="services">

        <label class="service">
            <input type="checkbox" value="google" checked>
            Google
        </label>

        <label class="service">
            <input type="checkbox" value="bing">
            Bing
        </label>

        <label class="service">
            <input type="checkbox" value="duckduckgo">
            DuckDuckGo
        </label>

        <label class="service">
            <input type="checkbox" value="brave">
            Brave
        </label>

        <label class="service">
            <input type="checkbox" value="yahoo">
            Yahoo
        </label>

        <label class="service">
            <input type="checkbox" value="youtube">
            YouTube
        </label>

    </div>

    <label class="title" for="keyword">
        Enter Your Search Phrase
    </label>

    <input
        type="text"
        id="keyword"
        placeholder="Enter your keyword or phrase..."
    >

    <div class="options">

        <label>
            <input type="checkbox" id="letters" checked>
            A-Z
        </label>

        <label>
            <input type="checkbox" id="numbers" checked>
            0-9
        </label>

    </div>

    <button class="search-btn" id="searchButton">
        Search
    </button>

    <button class="clear-btn" id="clearButton">
        Clear Results
    </button>

    <div id="status"></div>

</div>

<div class="panel">

    <div class="results-top">

        <h2>Search Results</h2>

        <span id="counter">0 Results</span>

        <button class="copy-btn" id="copyButton">
            Copy All
        </button>

    </div>

    <textarea
        id="results"
        readonly
        placeholder="Your search suggestions will appear here..."
    ></textarea>

</div>

</div>

<script>

// ======================================
// SEARCHMINER CONFIGURATION
// ======================================

const proxy = "https://proxy.cors.dev/";

const characters = "abcdefghijklmnopqrstuvwxyz0123456789";

let totalResults = 0;
let searching = false;


// ======================================
// GET SELECTED SERVICES
// ======================================

function getServices() {

    return Array.from(
        document.querySelectorAll(
            '.service input:checked'
        )
    ).map(input => input.value);

}


// ======================================
// BUILD SEARCH PHRASES
// ======================================

function buildQueries(keyword) {

    let queries = [keyword];

    let additions = "";

    if (document.getElementById("letters").checked) {
        additions += "abcdefghijklmnopqrstuvwxyz";
    }

    if (document.getElementById("numbers").checked) {
        additions += "0123456789";
    }

    for (const character of additions) {

        // Append directly to the exact original phrase.
        // Do not remove or modify existing spaces.

        queries.push(keyword + character);

    }

    return queries;

}


// ======================================
// BUILD SERVICE URLS
// ======================================

function getServiceURL(service, keyword) {

    const q = encodeURIComponent(keyword);

    switch (service) {

        case "google":

            return "https://suggestqueries.google.com/complete/search?client=firefox&hl=en&q=" + q;

        case "bing":

            return "https://api.bing.com/osjson.aspx?query=" + q;

        case "duckduckgo":

            return "https://ac.duckduckgo.com/ac/?q=" + q + "&type=list";

        case "brave":

            return "https://search.brave.com/api/suggest?q=" + q;

        case "yahoo":

            return "https://search.yahoo.com/sugg/gossip/gossip-us-ura/?output=fxjson&command=" + q;

        case "youtube":

            return "https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=" + q;

        default:

            return null;

    }

}


// ======================================
// EXTRACT SUGGESTIONS
// ======================================

function extractSuggestions(data) {

    let suggestions = [];

    // Google, Bing and YouTube:
    // [query, [suggestions]]

    if (
        Array.isArray(data) &&
        Array.isArray(data[1])
    ) {

        return data[1].filter(
            item => typeof item === "string"
        );

    }

    // DuckDuckGo:
    // [{phrase: "suggestion"}]

    if (Array.isArray(data)) {

        for (const item of data) {

            if (typeof item === "string") {

                suggestions.push(item);

            } else if (item && typeof item.phrase === "string") {

                suggestions.push(item.phrase);

            } else if (item && typeof item.q === "string") {

                suggestions.push(item.q);

            }

        }

    }

    // Yahoo and other object-based responses.

    if (data && typeof data === "object" && !Array.isArray(data)) {

        const possibleArrays = [
            data.r,
            data.results,
            data.suggestions,
            data.items
        ];

        for (const list of possibleArrays) {

            if (!Array.isArray(list)) continue;

            for (const item of list) {

                if (typeof item === "string") {

                    suggestions.push(item);

                } else if (item && typeof item.k === "string") {

                    suggestions.push(item.k);

                } else if (item && typeof item.phrase === "string") {

                    suggestions.push(item.phrase);

                } else if (item && typeof item.text === "string") {

                    suggestions.push(item.text);

                }

            }

        }

    }

    return suggestions;

}


// ======================================
// GET SUGGESTIONS
// ======================================

async function getSuggestions(service, keyword) {

    const endpoint = getServiceURL(service, keyword);

    if (!endpoint) return [];

    try {

        const response = await fetch(
            proxy + endpoint,
            {
                method: "GET",
                credentials: "omit"
            }
        );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data = await response.json();

        return extractSuggestions(data);

    } catch (error) {

        console.error(
            service,
            keyword,
            error
        );

        throw error;

    }

}


// ======================================
// ADD RESULTS
// ======================================

function addResults(suggestions, service) {

    const resultsBox =
        document.getElementById("results");

    for (const suggestion of suggestions) {

        // Keep duplicate suggestions.
        // Never automatically remove duplicates.

        resultsBox.value +=
            "[" + service.toUpperCase() + "] " +
            suggestion + "\n";

        totalResults++;

    }

    document.getElementById("counter").textContent =
        totalResults + " Results";

}


// ======================================
// MAIN SEARCH FUNCTION
// ======================================

async function runSearch() {

    if (searching) return;

    const keyword =
        document.getElementById("keyword").value;

    if (!keyword.trim()) {

        document.getElementById("status").textContent =
            "Enter a search phrase first.";

        return;

    }

    const services = getServices();

    if (services.length === 0) {

        document.getElementById("status").textContent =
            "Select at least one search service.";

        return;

    }

    searching = true;

    const searchButton =
        document.getElementById("searchButton");

    searchButton.disabled = true;

    const queries = buildQueries(keyword);

    // Create one task for each phrase and service.

    let tasks = [];

    for (const query of queries) {

        for (const service of services) {

            tasks.push({
                query: query,
                service: service
            });

        }

    }

    const batchSize = 5;

    let completed = 0;
    let failed = 0;

    const status =
        document.getElementById("status");

    status.textContent =
        "Starting SearchMiner...";

    // Process requests in batches of five.

    for (
        let i = 0;
        i < tasks.length;
        i += batchSize
    ) {

        const batch = tasks.slice(
            i,
            i + batchSize
        );

        const responses = await Promise.all(

            batch.map(async task => {

                try {

                    const suggestions =
                        await getSuggestions(
                            task.service,
                            task.query
                        );

                    return {
                        service: task.service,
                        suggestions: suggestions,
                        success: true
                    };

                } catch (error) {

                    return {
                        service: task.service,
                        suggestions: [],
                        success: false
                    };

                }

            })

        );

        for (const response of responses) {

            if (response.success) {

                addResults(
                    response.suggestions,
                    response.service
                );

            } else {

                failed++;

            }

        }

        completed += batch.length;

        status.textContent =
            "Searching: " +
            completed +
            " / " +
            tasks.length +
            " requests completed. " +
            "Found " +
            totalResults +
            " suggestions.";

    }

    status.textContent =
        "Search completed! " +
        totalResults +
        " total suggestions. " +
        failed +
        " failed requests.";

    searching = false;

    searchButton.disabled = false;

}


// ======================================
// CLEAR RESULTS
// ======================================

function clearResults() {

    if (searching) return;

    document.getElementById("results").value = "";

    totalResults = 0;

    document.getElementById("counter").textContent =
        "0 Results";

    document.getElementById("status").textContent = "";

}


// ======================================
// COPY ALL RESULTS
// ======================================

async function copyResults() {

    const results =
        document.getElementById("results").value;

    if (!results.trim()) return;

    try {

        await navigator.clipboard.writeText(results);

        document.getElementById("copyButton").textContent =
            "Copied!";

        setTimeout(() => {

            document.getElementById("copyButton").textContent =
                "Copy All";

        }, 1500);

    } catch (error) {

        document.getElementById("status").textContent =
            "Unable to copy results.";

    }

}


// ======================================
// BUTTON EVENTS
// ======================================

document.getElementById("searchButton")
    .addEventListener("click", runSearch);

document.getElementById("clearButton")
    .addEventListener("click", clearResults);

document.getElementById("copyButton")
    .addEventListener("click", copyResults);

document.getElementById("keyword")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            runSearch();
        }

    });

</script>

</body>
</html>
